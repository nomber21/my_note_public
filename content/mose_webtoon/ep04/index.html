<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>꼬마 모세 모여라! — ep04 — 바로와 재앙 (픽사 3D)</title>
<style>
  :root { --max-w: 720px; --panel-gap: 4px; --page-bg: #1a1a1f; --strip-bg: #0e0e10; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--page-bg); font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; color: #f5f5f7; -webkit-text-size-adjust: 100%; }
  header.viewer-head { position: sticky; top: 0; z-index: 50; background: rgba(14,14,16,.92); color: #f5f5f7; text-align: center; padding: 10px 12px; font-size: 14px; letter-spacing: .02em; backdrop-filter: blur(6px); }
  header.viewer-head b { font-weight: 700; }
  .strip { max-width: var(--max-w); margin: 0 auto; background: var(--strip-bg); display: flex; flex-direction: column; gap: var(--panel-gap); }
  .panel { position: relative; line-height: 0; }
  .panel.break { margin-top: 20px; }
  .panel img { width: 100%; height: auto; display: block; background: #1c1c22; }
  .panel .missing { line-height: 1.5; color: #b00020; background: #fff3f3; border: 2px dashed #b00020; text-align: center; padding: 48px 12px; font-size: 14px; }
  footer.viewer-foot { color: #9a9aa2; text-align: center; padding: 28px 12px 60px; font-size: 13px; max-width: var(--max-w); margin: 0 auto; }
</style>
</head>
<body>
<header class="viewer-head"><b id="m-title">꼬마 모세 모여라!</b> · <span id="m-ep">ep04 — 바로와 재앙 (픽사 3D)</span></header>
<main class="strip" id="strip" aria-label="webtoon vertical viewer"></main>
<footer class="viewer-foot" id="foot"></footer>

<script>
const META = { title: "꼬마 모세 모여라!", episode: "ep04 — 바로와 재앙 (픽사 3D)" };
const PANELS = [
  { src: "./panels/panel_01.png", alt: "panel 01 — 표지" },
  { src: "./panels/panel_02.png", alt: "panel 02 — 왕궁 입장", break: true },
  { src: "./panels/panel_03.png", alt: "panel 03 — 모세 선포" },
  { src: "./panels/panel_04.png", alt: "panel 04 — 바로 거절 1" },
  { src: "./panels/panel_05.png", alt: "panel 05 — 개구리 재앙", break: true },
  { src: "./panels/panel_06.png", alt: "panel 06 — 백성2 반응" },
  { src: "./panels/panel_07.png", alt: "panel 07 — 모세 호소" },
  { src: "./panels/panel_08.png", alt: "panel 08 — 바로 고집" },
  { src: "./panels/panel_09.png", alt: "panel 09 — 파리 재앙", break: true },
  { src: "./panels/panel_10.png", alt: "panel 10 — 백성1 반응" },
  { src: "./panels/panel_11.png", alt: "panel 11 — 귀 막는 바로" },
  { src: "./panels/panel_12.png", alt: "panel 12 — 메뚜기 재앙", break: true },
  { src: "./panels/panel_13.png", alt: "panel 13 — 백성2 빈 바구니" },
  { src: "./panels/panel_14.png", alt: "panel 14 — 모세 단호" },
  { src: "./panels/panel_15.png", alt: "panel 15 — 바로 거절 4" },
  { src: "./panels/panel_16.png", alt: "panel 16 — 어두운 밤 도입", break: true },
  { src: "./panels/panel_17.png", alt: "panel 17 — 문에 표식" },
  { src: "./panels/panel_18.png", alt: "panel 18 — 보호의 빛" },
  { src: "./panels/panel_19.png", alt: "panel 19 — 어둠과 황금 안개", break: true },
  { src: "./panels/panel_20.png", alt: "panel 20 — 바로 어깨 처짐" },
  { src: "./panels/panel_21.png", alt: "panel 21 — 우는 신하1" },
  { src: "./panels/panel_22.png", alt: "panel 22 — 후회 신하2" },
  { src: "./panels/panel_23.png", alt: "panel 23 — 바로 허락", break: true },
  { src: "./panels/panel_24.png", alt: "panel 24 — 클리프행어", break: true }
];

function el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function renderPanel(p, i){
  const panel = el("div", "panel" + (p.break ? " break" : ""));
  const img = new Image();
  img.loading = "lazy";
  img.decoding = "async";
  img.alt = p.alt || ("panel " + String(i+1).padStart(2,"0"));
  img.src = p.src;
  img.onerror = () => { const ph = el("div", "missing", "⚠ 패널 이미지 누락/손상: " + p.src); img.replaceWith(ph); };
  panel.appendChild(img);
  return panel;
}
(function init(){
  document.title = META.title + " — " + META.episode;
  document.getElementById("m-title").textContent = META.title;
  document.getElementById("m-ep").textContent = META.episode;
  const strip = document.getElementById("strip");
  PANELS.forEach((p,i) => strip.appendChild(renderPanel(p,i)));
  document.getElementById("foot").textContent = "총 " + PANELS.length + " 패널 · 끝까지 스크롤하세요";
})();
</script>
</body>
</html>
